<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原料訂購</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  background: #f5f6f8;
  color: #222;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 18px 14px 40px;
}

/* 頂部 */
.header {
  background: linear-gradient(135deg, #7b4b2a, #a66a3f);
  color: white;
  border-radius: 18px;
  padding: 22px 18px;
  text-align: center;
  margin-bottom: 16px;
  box-shadow: 0 5px 15px rgba(0,0,0,.12);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 8px 0 0;
  opacity: .92;
  font-size: 14px;
}

/* 地點 */
.location {
  background: white;
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.location-title {
  background: #fff3e8;
  color: #7b4b2a;
  font-size: 20px;
  font-weight: bold;
  padding: 15px 16px;
  border-bottom: 1px solid #eee;
}

/* 品項 */
.product {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 15px;
  border-bottom: 1px solid #eee;
}

.product:last-child {
  border-bottom: none;
}

.product-info {
  min-width: 0;
  flex: 1;
}

.product-name {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}

.product-price {
  color: #d35400;
  font-size: 14px;
  margin-top: 3px;
}

/* 數量 */
.qty-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.qty-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: #7b4b2a;
  color: white;
  font-size: 22px;
  cursor: pointer;
  line-height: 36px;
}

.qty-btn:active {
  transform: scale(.94);
}

.qty-input {
  width: 58px;
  height: 36px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  outline: none;
}

.qty-input:focus {
  border-color: #7b4b2a;
}

.subtotal {
  min-width: 70px;
  text-align: right;
  font-size: 14px;
  color: #666;
}

/* 訂單摘要 */
.summary {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-top: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.summary h2 {
  margin: 0 0 12px;
  font-size: 20px;
}

.total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
  font-weight: bold;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.total-price {
  color: #d35400;
  font-size: 25px;
}

.order-text {
  width: 100%;
  min-height: 160px;
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  resize: vertical;
  font-size: 15px;
  line-height: 1.6;
  background: #fafafa;
}

/* 按鈕 */
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.action-btn {
  border: none;
  border-radius: 11px;
  padding: 13px 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.copy-btn {
  background: #7b4b2a;
  color: white;
}

.share-btn {
  background: #eee;
  color: #333;
}

.clear-btn {
  width: 100%;
  margin-top: 10px;
  background: #f5f5f5;
  color: #777;
  border: 1px solid #ddd;
}

/* 網址區 */
.link-box {
  margin-top: 14px;
  padding: 14px;
  background: #f8f8f8;
  border-radius: 10px;
  font-size: 13px;
  color: #666;
  word-break: break-all;
}

.tiktok-link {
  display: block;
  margin-top: 13px;
  padding: 11px;
  background: #000;
  color: white !important;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;
}

.tiktok-link:active {
  transform: scale(.98);
}

/* 手機 */
@media (max-width: 480px) {

  .container {
    padding: 12px 10px 30px;
  }

  .product {
    padding: 13px 10px;
  }

  .product-name {
    font-size: 16px;
  }

  .qty-box {
    gap: 4px;
  }

  .qty-btn {
    width: 34px;
    height: 34px;
    line-height: 34px;
  }

  .qty-input {
    width: 52px;
    height: 34px;
  }

  .subtotal {
    display: none;
  }
}
</style>
</head>

<script>

/* ==========================
   取得所有品項
========================== */

const products =
  document.querySelectorAll(".product");


/* ==========================
   更新訂單
========================== */

function updateAll() {

  let total = 0;

  let order = [];


  products.forEach(product => {

    const name =
      product.dataset.name;

    const price =
      Number(product.dataset.price);

    const input =
      product.querySelector(".qty-input");

    const subtotal =
      product.querySelector(".subtotal");


    let qty =
      parseInt(input.value);


    if (
      isNaN(qty) ||
      qty < 0
    ) {

      qty = 0;

      input.value = 0;

    }


    const money =
      qty * price;


    subtotal.textContent =
      "$" + money.toLocaleString();


    total += money;


    if (qty > 0) {

      order.push(
        name +
        " × " +
        qty +
        " = $" +
        money.toLocaleString()
      );

    }

  });


  /* 總金額 */

  document.getElementById(
    "totalPrice"
  ).textContent =
    "$" + total.toLocaleString();


  /* 訂單文字 */

  let text = "";


  if (order.length > 0) {

    text =
      "📦 原料訂購\n\n" +
      order.join("\n") +
      "\n\n💰 總金額：$" +
      total.toLocaleString();

  } else {

    text =
      "目前尚未選擇任何品項";

  }


  document.getElementById(
    "orderText"
  ).value = text;

}


/* ==========================
   ＋
========================== */

document
  .querySelectorAll(".plus")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const input =
          button.parentElement
            .querySelector(".qty-input");


        let value =
          parseInt(input.value) || 0;


        input.value =
          value + 1;


        updateAll();

      }
    );

  });


/* ==========================
   −
========================== */

document
  .querySelectorAll(".minus")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const input =
          button.parentElement
            .querySelector(".qty-input");


        let value =
          parseInt(input.value) || 0;


        if (value > 0) {

          value--;

        }


        input.value =
          value;


        updateAll();

      }
    );

  });


/* ==========================
   手動輸入數量
========================== */

document
  .querySelectorAll(".qty-input")
  .forEach(input => {

    input.addEventListener(
      "input",
      () => {

        if (input.value === "") {

          updateAll();

          return;

        }


        let value =
          parseInt(input.value);


        if (
          isNaN(value) ||
          value < 0
        ) {

          input.value = 0;

        }


        updateAll();

      }
    );

  });


/* ==========================
   複製訂單
========================== */

function copyOrder() {

  const text =
    document.getElementById(
      "orderText"
    ).value;


  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(text)
      .then(() => {

        alert(
          "✅ 訂單已複製！"
        );

      })
      .catch(() => {

        fallbackCopy(text);

      });

  } else {

    fallbackCopy(text);

  }

}


/* 備用複製方法 */

function fallbackCopy(text) {

  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value = text;

  document.body.appendChild(
    textarea
  );

  textarea.select();

  try {

    document.execCommand(
      "copy"
    );

    alert(
      "✅ 訂單已複製！"
    );

  } catch (error) {

    alert(
      "請長按訂單內容後自行複製。"
    );

  }

  document.body.removeChild(
    textarea
  );

}


/* ==========================
   分享網頁
========================== */

async function sharePage() {

  const url =
    window.location.href;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "原料訂購",

        text:
          "📦 原料訂購連結",

        url:
          url

      });

    } catch (error) {

      /* 使用者取消分享 */

    }

  } else {

    try {

      await navigator.clipboard
        .writeText(url);

      alert(
        "🔗 網頁連結已複製！\n\n" +
        "可以貼到 LINE、Messenger 或其他地方分享。"
      );

    } catch (error) {

      alert(
        "請直接複製瀏覽器網址列的網址。"
      );

    }

  }

}


/* ==========================
   清除全部
========================== */

function clearAll() {

  const yes =
    confirm(
      "確定要清除所有數量嗎？"
    );


  if (!yes) {

    return;

  }


  document
    .querySelectorAll(".qty-input")
    .forEach(input => {

      input.value = 0;

    });


  updateAll();

}


/* ==========================
   顯示目前網頁網址
========================== */

document.getElementById(
  "pageLink"
).textContent =
  window.location.href;


/* ==========================
   啟動
========================== */

updateAll();

</script>
