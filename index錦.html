<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>原料訂購</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f6f8;
  color: #222;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 12px 10px 40px;
}


/* =========================
   貨款餘額
========================= */

.balance {
  background: #fff;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 12px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.balance-title {
  font-size: 18px;
  font-weight: bold;
}

.balance-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}

.balance-input {
  width: 180px;

  text-align: right;

  border: 1px solid #ccc;
  border-radius: 10px;

  padding: 10px;

  font-size: 21px;
  font-weight: bold;

  outline: none;
}

.balance-input:focus {
  border-color: #7b4b2a;
}

.balance-input::placeholder {
  color: #999;
  font-weight: normal;
}

.remaining {
  font-size: 25px;
  font-weight: 800;
  color: #777;
}

.remaining.ok {
  color: #2e7d32;
}

.remaining.insufficient {
  color: #c62828;
}


/* =========================
   標題
========================= */

.header {

  background:
    linear-gradient(
      135deg,
      #7b4b2a,
      #a66a3f
    );

  color: white;

  border-radius: 18px;

  padding: 20px 16px;

  text-align: center;

  margin-bottom: 12px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 7px 0 0;
  font-size: 14px;
}


/* =========================
   TikTok
========================= */

.tiktok {

  display: block;

  background: #000;

  color: #fff;

  text-decoration: none;

  text-align: center;

  border-radius: 12px;

  padding: 13px;

  margin-bottom: 16px;

  font-weight: bold;

  font-size: 16px;
}

.tiktok:active {
  transform: scale(.98);
}


/* =========================
   地點
========================= */

.location {

  background: #fff;

  border-radius: 18px;

  margin-bottom: 16px;

  overflow: hidden;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);
}

.location-title {

  background: #fff3e8;

  color: #7b4b2a;

  font-size: 21px;

  font-weight: bold;

  padding: 16px;

  border-bottom:
    1px solid #eee;
}


/* =========================
   品項
========================= */

.product {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 14px 10px;

  border-bottom:
    1px solid #eee;
}

.product:last-child {
  border-bottom: none;
}

.product-info {

  flex: 1;

  min-width: 0;
}

.product-name {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 5px;
}


/* =========================
   ★ 手動價格
========================= */

.price-row {

  display: flex;

  align-items: center;

  gap: 3px;

  color: #d35400;

  font-size: 16px;
}

.price-symbol {

  color: #d35400;

  font-size: 17px;
}

.price-input {

  width: 105px;

  height: 31px;

  padding: 2px 4px;

  border: none;

  border-bottom: 2px solid #e6b18d;

  border-radius: 3px;

  background: transparent;

  color: #d35400;

  font-size: 17px;

  font-weight: 600;

  outline: none;

  text-align: left;
}

.price-input:focus {

  border-bottom:
    2px solid #d35400;

  background: #fff8f3;
}

.price-unit {

  color: #d35400;

  font-size: 15px;

  white-space: nowrap;
}


/* =========================
   數量
========================= */

.qty-box {

  display: flex;

  align-items: center;

  gap: 5px;

  flex-shrink: 0;
}

.qty-btn {

  width: 36px;

  height: 36px;

  border: none;

  border-radius: 10px;

  background: #7b4b2a;

  color: white;

  font-size: 22px;

  cursor: pointer;
}

.qty-btn:active {
  transform: scale(.94);
}

.qty-input {

  width: 56px;

  height: 36px;

  border:
    1px solid #ccc;

  border-radius: 9px;

  text-align: center;

  font-size: 17px;

  font-weight: bold;

  outline: none;
}

.qty-input:focus {
  border-color: #7b4b2a;
}


/* =========================
   訂單明細
========================= */

.summary {

  background: #fff;

  border-radius: 18px;

  padding: 17px;

  margin-top: 16px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);
}

.summary h2 {

  margin: 0 0 12px;

  font-size: 21px;
}

.total {

  display: flex;

  justify-content: space-between;

  align-items: center;

  font-size: 19px;

  font-weight: bold;

  padding: 11px 0;

  border-bottom:
    1px solid #eee;
}

.total-price {

  color: #d35400;

  font-size: 25px;
}

.order-text {

  width: 100%;

  min-height: 300px;

  margin-top: 14px;

  padding: 14px;

  border:
    1px solid #ddd;

  border-radius: 11px;

  resize: vertical;

  font-size: 16px;

  line-height: 1.8;

  background: #fafafa;

  outline: none;
}


/* =========================
   按鈕
========================= */

.buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 11px;
}

.action-btn {

  border: none;

  border-radius: 11px;

  padding: 14px 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.copy-btn {

  background: #7b4b2a;

  color: white;
}

.clear-btn {

  background: #f2f2f2;

  color: #666;

  border:
    1px solid #ddd;
}


/* =========================
   手機
========================= */

@media (max-width: 480px) {

  .balance-input {
    width: 165px;
  }

  .product-name {
    font-size: 16px;
  }

  .price-input {
    width: 82px;
    font-size: 16px;
  }

  .price-unit {

  }

  .qty-btn {

    height: 34px;
  }

  .qty-input {
    width: 53px;
    height: 34px;
  }

}


/* =========================
   防止 iPhone 點擊輸入框時
   放大畫面
========================= */

input,
textarea,
button {
  -webkit-tap-highlight-color: transparent;
}

input {
  font-size: 16px;

<script>


/* =========================
   所有品項
========================= */

const products =
  document.querySelectorAll(".product");


const balanceInput =
  document.getElementById("balanceInput");



/* =========================
   更新全部
========================= */

function updateAll() {

  let total = 0;

  let chongqingOrder = [];

  let whiteSugar = [];

  let brownSugar = [];

  let other = [];


  products.forEach(product => {

    const name =
      product.dataset.name;

    const unit =
      product.dataset.unit || "";


    /* =====================
       價格
    ===================== */

    const priceInput =
      product.querySelector(
        ".price-input"
      );


    let price =
      parseFloat(
        priceInput.value
      );


    if (
      isNaN(price) ||
      price < 0
    ) {

      price = 0;

    }


    /* =====================
       數量
    ===================== */

    const qtyInput =
      product.querySelector(
        ".qty-input"
      );


    let qty =
      parseInt(
        qtyInput.value
      );


    if (
      isNaN(qty) ||
      qty < 0
    ) {

      qty = 0;

      qtyInput.value = 0;

    }


    /* =====================
       小計
    ===================== */

    const money =
      qty * price;


    total += money;


    /* =====================
       有數量才加入訂單
    ===================== */

    if (qty > 0) {

      let item =
        name +
        " × " +
        qty +
        " = $" +
        money.toLocaleString();


      if (unit !== "") {

        item +=
          "（" +
          unit +
          "）";

      }


      /* ===================
         重慶南路
      =================== */

      if (

        [
          "麵線",
          "油蔥",
          "沙茶",
          "味素",
          "地瓜粉",
          "鈦白粉",
          "香油"
        ].includes(name)

      ) {

        chongqingOrder.push(item);

      }


      /* ===================
         白糖
      =================== */

      else if (

        [
          "白糖15斤",
          "白糖30斤"
        ].includes(name)

      ) {

        whiteSugar.push(item);

      }


      /* ===================
         紅糖
      =================== */

      else if (

        [
          "紅糖10斤",
          "紅糖15斤",
          "紅糖20斤"
        ].includes(name)

      ) {

        brownSugar.push(item);

      }


      /* ===================
         其他
      =================== */

      else {

        other.push(item);

      }

    }

  });



  /* =========================
     本次訂單
  ========================= */

  document.getElementById(
    "totalPrice"
  ).textContent =

    "$" +
    total.toLocaleString();



  /* =========================
     貨款餘額
  ========================= */

  const raw =
    balanceInput.value.trim();


  const remainingElement =
    document.getElementById(
      "remaining"
    );


  const message =
    document.getElementById(
      "balanceMessage"
    );


  /* =========================
     尚未輸入貨款
  ========================= */

  if (raw === "") {

    remainingElement.textContent =
      "請先輸入貨款";

    remainingElement.className =
      "remaining";

    message.textContent = "";

  }


  /* =========================
     已輸入貨款
  ========================= */

  else {

    const balance =
      Number(raw);


    const remaining =
      balance - total;


    remainingElement.textContent =

      "$" +
      remaining.toLocaleString();


    /* =====================
       餘額不足
    ===================== */

    if (remaining < 0) {

      remainingElement.className =
        "remaining insufficient";


      message.textContent =

        "🔴 寄存餘額不足 $" +

        Math.abs(
          remaining
        ).toLocaleString();


      message.style.color =
        "#c62828";

    }


    /* =====================
       餘額足夠
    ===================== */

    else {

      remainingElement.className =
        "remaining ok";


      if (total > 0) {

        message.textContent =

          "🟢 本次已自動扣款 $" +

          total.toLocaleString();

      }

      else {

        message.textContent = "";

      }


      message.style.color =
        "#2e7d32";

    }

  }



  /* =========================
     訂單文字
  ========================= */

  let text =
    "📦 原料訂購\n\n";


  /* =========================
     重慶南路
  ========================= */

  if (
    chongqingOrder.length > 0
  ) {

    text +=

      "📍 重慶南路\n" +

      chongqingOrder.join("\n") +

      "\n\n\n";

  }



  /* =========================
     泉州街
  ========================= */

  if (

    whiteSugar.length > 0 ||

    brownSugar.length > 0 ||

    other.length > 0

  ) {

    text +=

      "📍 泉州街\n";


    /* =====================
       其他
    ===================== */

    if (
      other.length > 0
    ) {

      text +=
        other.join("\n");


      if (
        whiteSugar.length > 0
      ) {

        text += "\n";

      }

    }


    /* =====================
       白糖
    ===================== */

    if (
      whiteSugar.length > 0
    ) {

      text +=
        whiteSugar.join("\n");

    }


    /* =====================
       白糖 → 紅糖
    ===================== */

    if (
      brownSugar.length > 0
    ) {

      text +=

        "\n\n\n" +

        brownSugar.join("\n");

    }


    text +=
      "\n\n\n";

  }



  /* =========================
     金額
  ========================= */

  text +=

    "💰 本次訂單：$" +

    total.toLocaleString();



  /* =========================
     有輸入貨款
  ========================= */

  if (
    raw !== ""
  ) {

    const balance =
      Number(raw);


    const remaining =
      balance - total;


    text +=

      "\n💵 原貨款餘額：$" +

      balance.toLocaleString();


    text +=

      "\n💵 扣款後餘額：$" +

      remaining.toLocaleString();


    /* =====================
       不足
    ===================== */

    if (
      remaining < 0
    ) {

      text +=

        "\n🔴 還需補款：$" +

        Math.abs(
          remaining
        ).toLocaleString();

    }

  }


  document.getElementById(
    "orderText"
  ).value = text;

}



/* =========================
   ＋增加數量
========================= */

document
  .querySelectorAll(".plus")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        const input =
          this.parentElement
            .querySelector(
              ".qty-input"
            );


        let value =
          parseInt(
            input.value
          ) || 0;


        input.value =
          value + 1;


        updateAll();

      }
    );

  });



/* =========================
   −減少數量
========================= */

document
  .querySelectorAll(".minus")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        const input =
          this.parentElement
            .querySelector(
              ".qty-input"
            );


        let value =
          parseInt(
            input.value
          ) || 0;


        value =
          Math.max(
            0,
            value - 1
          );


        input.value =
          value;


        updateAll();

      }
    );

  });



/* =========================

========================= */

document
  .querySelectorAll(".qty-input")
  .forEach(input => {

    input.addEventListener(
      "input",
      function() {

        updateAll();

      }
    );

  });



/* =========================

========================= */

document
  .querySelectorAll(".price-input")
  .forEach(input => {

========================= */

balanceInput.addEventListener(

  }

/* =========================
   複製訂單
========================= */

function copyOrder() {

  const text =
    document.getElementById(
      "orderText"
    ).value;


  if (

    navigator.clipboard &&

    window.isSecureContext

  ) {

    navigator.clipboard
      .writeText(text)
      .then(function() {

        alert(
          "✅ 訂單已複製！"
        );

      })
      .catch(function() {

        fallbackCopy(text);

      });

  }

  else {

    fallbackCopy(text);

  }

}



/* =========================
   備用複製
========================= */

function fallbackCopy(text) {

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";


  document.body.appendChild(
    textarea
  );


  textarea.select();


  try {

    document.execCommand(
      "copy"
    );


    alert(
      "✅ 訂單已複製！"
    );

  }

  catch (error) {

    alert(
      "請長按訂單內容自行複製。"
    );

  }


  document.body.removeChild(
    textarea
  );

}



/* =========================
   清除全部數量
========================= */

function clearAll() {

  const yes =
    confirm(
      "確定要清除所有訂購數量嗎？"
    );


  if (!yes) {
    return;
  }


  products.forEach(
    product => {

      product
        .querySelector(
          ".qty-input"
        )
        .value = 0;

    }
  );


  updateAll();

}



/* =========================
   啟動
========================= */

updateAll();
