<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{background:#f7f3ea;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:96px}
.header{background:linear-gradient(135deg,#ef704d,#e85d3c);color:#fff;padding:24px 18px 22px;border-radius:0 0 24px 24px}
.header h1{margin:0;font-size:28px;font-weight:900}
.header p{margin:7px 0 0;font-size:15px}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 14px}
.gallery{width:100%;padding-top:12px}
.hero{width:100%;height:250px;display:block;object-fit:cover;border-radius:18px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.thumbs img{width:100%;height:105px;display:block;object-fit:cover;border-radius:14px}
.notice{margin-top:14px;background:#fff7d8;border-left:5px solid #f3bd2e;border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.65}
.title{font-size:22px;font-weight:900;margin:22px 3px 10px}
.card{background:#fff;border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-size:17px;font-weight:800}
.price{font-size:17px;font-weight:900;color:#e85d3c;margin-top:4px}
.qty{display:flex;align-items:center;gap:9px;flex:none}
.qty button{width:38px;height:38px;border:0;border-radius:50%;background:#ef704d;color:#fff;font-size:23px;font-weight:800}
.qty span{min-width:20px;text-align:center;font-size:18px;font-weight:800}
.info{background:#fff;border-radius:17px;padding:16px;margin-top:20px;box-shadow:0 2px 12px rgba(0,0,0,.05);line-height:1.8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{border:0;border-radius:12px;padding:12px;background:#eef5ff;color:#1767ad;font-weight:800}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.cartbtn{display:block;width:100%;max-width:680px;margin:auto;border:0;border-radius:17px;background:#218be8;color:#fff;padding:15px;font-size:20px;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;padding:18px;overflow:auto}
.box{max-width:620px;margin:35px auto;background:#fff;border-radius:20px;padding:18px}
.close{float:right;border:0;border-radius:50%;width:35px;height:35px;font-size:22px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}
.total{text-align:right;color:#e85d3c;font-size:21px;font-weight:900;margin-top:12px}
label{display:block;margin-top:12px;font-weight:700}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:6px}
.submit{width:100%;margin-top:15px;padding:14px;border:0;border-radius:13px;background:#ef704d;color:#fff;font-size:17px;font-weight:900}
@media(min-width:681px){.hero{height:340px}}

.tiktok-panel{text-align:center;margin-bottom:20px}
.tiktok-id{font-size:20px;font-weight:800;margin:5px 0}
.tiktok-qr{display:block;width:min(82vw,360px);height:auto;margin:12px auto 4px;border-radius:12px}
.tiktok-link{display:inline-block;margin:8px auto 12px;padding:11px 18px;background:#111;color:#fff;text-decoration:none;border-radius:12px;font-weight:800}
.tiktok-id a{color:#111;text-decoration:none}

.top-tiktok{max-width:680px;margin:12px auto 0;padding:0 14px}
.top-tiktok a{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;border-radius:14px;padding:14px 10px;font-size:18px;font-weight:800}
</style>
